<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Done! — School Drive Archiver</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md text-center">

    <!-- Success icon -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500 mb-6 shadow-lg">
      <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-2">Archive saved!</h1>
    <p class="text-gray-500 text-sm mb-8">
      Your files have been organized and saved to a new folder in your Google Drive.
      Files already in folders kept their original structure; everything else was sorted by year and subject.
    </p>

    <!-- Open Drive button -->
    <a
      href="{{ folder_url }}"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center justify-center gap-2 w-full rounded-xl bg-indigo-600 hover:bg-indigo-700
             active:bg-indigo-800 text-white font-semibold py-3 px-4 transition-colors shadow-md mb-4"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
      Open archive in Google Drive
    </a>

    <a
      href="/logout"
      class="block text-sm text-gray-400 hover:text-gray-600 transition-colors"
    >
      Archive another account
    </a>

  </div>

</body>
</html>
